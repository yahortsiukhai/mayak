global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'mayak-monitor'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'mayak-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8001']
        labels:
          service: 'mayak-api'
          environment: 'development'