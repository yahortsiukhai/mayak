{% extends "base.html" %}

{% block title %}Регистрация — Маяк{% endblock %}

{% block content %}
<section class="max-w-md mx-auto px-6 py-16">

    <h1 class="text-3xl font-semibold tracking-tight mb-2">Создать аккаунт</h1>
    <p class="text-muted mb-8">Бесплатно до 3 объектов. Без карты.</p>

    {% if error %}
    <div class="alert alert-error mb-6">{{ error }}</div>
    {% endif %}

    <form method="post" action="/register" class="space-y-5">
        <div>
            <label for="email" class="form-label">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                class="form-input"
                placeholder="you@example.com"
                required
                autofocus
                value="{{ email or '' }}"
            >
        </div>

        <div>
            <label for="password" class="form-label">Пароль</label>
            <input
                type="password"
                id="password"
                name="password"
                class="form-input"
                placeholder="Минимум 8 символов"
                minlength="8"
                required
            >
        </div>

        <button type="submit" class="btn btn-primary w-full">
            Создать аккаунт
        </button>
    </form>

    <p class="text-center text-sm text-muted mt-6">
        Уже есть аккаунт?
        <a href="/login" class="link">Войти</a>
    </p>

</section>
{% endblock %}
